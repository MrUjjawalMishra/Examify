name: Examify CI Verification

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'codex/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/workers

      - name: Install & Verify Workers API + Automated Tests
        working-directory: apps/workers
        run: |
          npm run typecheck
          npm test

      - name: Install & Build Web Frontend
        working-directory: apps/web
        run: |
          npm run build
