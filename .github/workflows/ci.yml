name: Examify CI Verification

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Verify Workers API + Automated Tests
        working-directory: apps/workers
        run: |
          npm install
          npm run typecheck
          npm test

      - name: Install & Build Web Frontend
        working-directory: apps/web
        run: |
          npm install
          npm run typecheck
          npm run build